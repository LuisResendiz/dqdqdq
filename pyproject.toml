[project]
name = "dqdqdq"
version = "0.1.0"
description = "Fuzzy data-quality checks with typed values and confidence scores, powered by fast decision models such as Jev."
readme = "README.md"
license = "MIT"
authors = [{ name = "Luis Resendiz" }]
requires-python = ">=3.10"
keywords = ["data-quality", "fuzzy-matching", "iso-3166", "jev", "llm"]
dependencies = [
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pycountry>=24.6.1",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
app = ["streamlit>=1.38", "pandas>=2.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pandas>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
